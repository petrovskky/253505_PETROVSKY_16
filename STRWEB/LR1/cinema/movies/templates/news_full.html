{% extends "base_generic.html" %}
{% block title %}{{ news.title }} - Starlight Cinema{% endblock title %}
{% block header %}News{% endblock header %}
{% block content %}
<article>
    <h2>{{ news.title }}</h2>
    <img src="{{ news.image.url }}" alt="{{ news.title }}">
    <p>{{ news.description|linebreaks }}</p>
</article>
{% endblock content %}
